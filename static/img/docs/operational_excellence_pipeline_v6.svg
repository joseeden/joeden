<!-- ============================================================
     OBSERVABILITY BAND
     band_y=668 (CARD_BOTTOM 620 + 48)
     band_h=220 band_bottom=888
     Two inner cards split within GCP overlay x=420..1860 w=1440
     Inner card w=620 gap=60
     Left:  x=460 cx=770  right=1080
     Right: x=1200 cx=1510 right=1820  (1820 < 1860-40=1820 ✓)
     Inner card h=180
     icon inside band card: translate(cx-48, band_card_y+24)
     title: band_card_y + 24 + 96 + 28 = band_card_y+148
     sub:   band_card_y + 148 + 34
     band_card_y = 668+20 = 688
     icon_y=712  title_y=836  → too tall. Shrink: icon scale(3)=72px
     icon_y=712  icon_bottom=784  title_y=784+24=808  sub=808+32=840
     band_card_bottom=688+180=868  840 < 868-12=856 ✓
     ============================================================ -->

<!-- Vertical dashed stubs from cards to band -->
