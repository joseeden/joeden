<text x="960" y="54" text-anchor="middle" font-size="38" font-weight="700" fill="#202124" font-family="'Roboto', sans-serif">Operational Excellence: CI/CD Pipeline on Google Cloud</text>

<!-- Footer -->
<rect x="0" y="1008" width="1920" height="72" fill="#f8f9fa"/>
<line x1="0" y1="1008" x2="1920" y2="1008" stroke="#e0e0e0" stroke-width="1"/>
<text x="960" y="1051" text-anchor="middle" font-size="22" font-weight="400" fill="#9aa0a6" font-family="'Roboto', sans-serif">Google Cloud Platform · Pillar Deep Dive: Operational Excellence</text>

<!-- ============================================================
     LAYOUT
     CARD_W=296 CARD_H=460 CARD_TOP=160 CARD_BOTTOM=620
     GAP between cards=56 (breathing room)
     5 cards total width = 5×296 + 4×56 = 1480+224 = 1704
     Start x = (1920-1704)/2 = 108
     card[0]: x=108  cx=256
     card[1]: x=460  cx=608
     card[2]: x=812  cx=960
     card[3]: x=1164 cx=1312
     card[4]: x=1516 cx=1664
     icon_group_y = 160+40 = 200
     icon renders 96px tall: y=200 to y=296
     title_y = 296+40 = 336  (40px gap below icon bottom)
     sub1_y  = 336+38 = 374
     sub2_y  = 374+38 = 412
     note_y  = 160+460-36 = 584   (584 > 412+40=452 ✓)
     GCP overlay: x=420 y=120 right=1860 w=1440 h=540
