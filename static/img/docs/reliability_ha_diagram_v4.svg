     CARD_W=300 CARD_H=420 CARD_TOP=340 CARD_BOTTOM=760
     icon_group_y=380 icon_bottom=476 title_y=516 sub1=554 sub2=592 note_y=724
     (note_y 724 > sub2 592+40=632 ✓  724 < 760-12=748 ✓)

     Load Balancer card (top center):
       x=810 cx=960 y=108 h=180  (standalone, above region)
       icon inside: y=108+20=128, scale(3)=72px, bottom=200, title=200+24=224, sub=258
       card bottom=288

     Region overlay: x=60 y=300 w=1800 h=510 (bottom=810)

     Zone A overlay: x=100 y=340 w=740 h=460 (bottom=800)
       card[0] MIG:     x=140 cx=290
       card[1] SQL:     x=500 cx=650

     Zone B overlay: x=1080 y=340 w=740 h=460 (bottom=800)
       card[2] MIG:     x=1120 cx=1270
       card[3] SQL:     x=1430 cx=1580

     Verify zone A overlay:
       left card x=140 >= overlay.x+40=140 ✓
       right card x+w=800 <= overlay.x+w-40=800 ✓

     Verify zone B overlay:
       left card x=1120 >= 1080+40=1120 ✓
       right card x+w=1730 <= 1080+740-40=1780 ✓

     LB → zone arrows: from LB card bottom (y=288) to zone card tops (y=340)
     Failover arrow: between SQL cards horizontally at mid-card y=550

     RTO/RPO bar: y=830 h=64
